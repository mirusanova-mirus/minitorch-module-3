name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numba==0.58.1" "numpy==1.26.4" "hypothesis==6.54" "pytest==8.3.2" pytest-env typing_extensions colorama
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
